[project]
name = "onshape-mcp"
version = "0.1.0"
description = "MCP server for the Onshape CAD API — documents, part studios, assemblies, drawings, import/export, and more"
requires-python = ">=3.11"
dependencies = [
    # The server is written against the v1 SDK (mcp.server.fastmcp.FastMCP).
    # mcp 2.x renamed that to MCPServer and changed other APIs, so v1 is pinned
    # until the code is migrated.
    "mcp[cli]>=1.0.0,<2",
    "httpx>=0.27.0",
]

[project.scripts]
onshape-mcp = "onshape_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
